[project]
name = "uma"
version = "0.1.0"
description = "An autograd framework for Apple Silicon"
readme = "README.md"
authors = [
    { name = "BriceLucifer", email = "2376671337@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.31.1",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
